<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RISHTONDA TEZ — Taksi</title>

<link
rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f2f2f2;
  color:#111;
}

.app{
  max-width:520px;
  margin:auto;
  height:100vh;
  background:white;
  position:relative;
  overflow:hidden;
}

header{
  height:70px;
  background:#ffd600;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  position:absolute;
  top:0;
  left:0;
  right:0;
  z-index:1000;
  box-shadow:0 2px 8px #0002;
}

.logo{
  font-size:22px;
  font-weight:900;
}

.city{
  font-size:13px;
  color:#444;
}

.menu{
  font-size:27px;
  cursor:pointer;
}

#map{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
}

.bottom{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  background:white;
  border-radius:25px 25px 0 0;
  padding:18px;
  z-index:1000;
  box-shadow:0 -4px 20px #0002;
}

.handle{
  width:45px;
  height:5px;
  background:#ccc;
  border-radius:10px;
  margin:0 auto 15px;
}

h2{
  font-size:22px;
  margin-bottom:15px;
}

.location{
  background:#f5f5f5;
  border-radius:15px;
  padding:14px;
  margin-bottom:10px;
  display:flex;
  align-items:center;
  gap:12px;
}

.dot{
  width:14px;
  height:14px;
  border-radius:50%;
  background:#111;
}

.green{
  background:#19a85b;
}

.location-text{
  flex:1;
}

.location-text b{
  display:block;
  font-size:15px;
}

.location-text span{
  color:#888;
  font-size:13px;
}

.price-box{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:15px 0;
}

.price{
  font-size:23px;
  font-weight:900;
}

.cars{
  color:#666;
  font-size:14px;
}

.call{
  width:100%;
  border:0;
  background:#ffd600;
  padding:17px;
  border-radius:16px;
  font-size:18px;
  font-weight:900;
  cursor:pointer;
}

.call:active{
  transform:scale(.98);
}

.cancel{
  width:100%;
  margin-top:8px;
  padding:12px;
  background:#eee;
  border:0;
  border-radius:14px;
  font-weight:bold;
  display:none;
}

.driver-card{
  display:none;
  background:#f6f6f6;
  border-radius:16px;
  padding:13px;
  margin-bottom:12px;
}

.driver{
  display:flex;
  align-items:center;
  gap:12px;
}

.avatar{
  width:50px;
  height:50px;
  border-radius:50%;
  background:#ddd;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:25px;
}

.driver-info{
  flex:1;
}

.driver-info b{
  display:block;
  font-size:16px;
}

.driver-info span{
  color:#777;
  font-size:13px;
}

.call-driver{
  background:#111;
  color:white;
  border:0;
  border-radius:12px;
  padding:11px 14px;
}

.driver-marker{
  background:#ffd600;
  border:3px solid white;
  width:38px;
  height:38px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
  box-shadow:0 2px 8px #0005;
}

.my-marker{
  background:#1976ff;
  border:4px solid white;
  width:25px;
  height:25px;
  border-radius:50%;
  box-shadow:0 2px 10px #0006;
}

.status{
  text-align:center;
  padding:8px;
  font-size:14px;
  color:#555;
}

@media(max-width:520px){
  .app{
    width:100%;
  }
}
</style>
</head>

<body>

<div class="app">

<header>
  <div>
    <div class="logo">RISHTONDA TEZ 🚕</div>
    <div class="city">Rishton va Farg‘ona</div>
  </div>
  <div class="menu">☰</div>
</header>

<div id="map"></div>

<div class="bottom">

  <div class="handle"></div>

  <div class="driver-card" id="driverCard">
    <div class="driver">
      <div class="avatar">👨‍✈️</div>

      <div class="driver-info">
        <b id="driverName">Haydovchi</b>
        <span id="driverCar">Chevrolet Cobalt • 4.9 ⭐</span>
      </div>

      <button class="call-driver" onclick="callDriver()">
        📞
      </button>
    </div>
  </div>

  <h2 id="title">Qayerga boramiz?</h2>

  <div class="location">
    <div class="dot"></div>

    <div class="location-text">
      <b id="fromText">Joylashuvingiz</b>
      <span>Olib ketish manzili</span>
    </div>
  </div>

  <div class="location">
    <div class="dot green"></div>

    <div class="location-text">
      <b>Manzilni tanlang</b>
      <span>Qayerga borasiz?</span>
    </div>
  </div>

  <div class="price-box">
    <div>
      <div class="cars">Yaqin haydovchilar</div>
      <div class="cars" id="driverCount">0 ta mashina</div>
    </div>

    <div class="price" id="price">
      15 000 so‘m
    </div>
  </div>

  <div class="status" id="status">
    Haydovchilar qidirilmoqda...
  </div>

  <button class="call" id="callButton" onclick="orderTaxi()">
    🚕 TAKSI CHAQIRISH
  </button>

  <button class="cancel" id="cancelButton" onclick="cancelOrder()">
    Bekor qilish
  </button>

</div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

let map;

let userLat = 40.3564;
let userLng = 71.2847;

let userMarker;

let drivers = [];

let ordered = false;

const driverNames = [
  "Jasur",
  "Azizbek",
  "Sardor",
  "Muhammad",
  "Bekzod",
  "Doston"
];

const cars = [
  "Chevrolet Cobalt",
  "Chevrolet Nexia 3",
  "Chevrolet Gentra",
  "Chevrolet Lacetti"
];


// XARITANI ISHGA TUSHIRISH
map = L.map("map").setView(
  [userLat,userLng],
  15
);

L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    maxZoom:19,
    attribution:"© OpenStreetMap"
  }
).addTo(map);


// FOYDALANUVCHI MARKERI
const userIcon = L.divIcon({
  className:"",
  html:'<div class="my-marker"></div>',
  iconSize:[25,25],
  iconAnchor:[12,12]
});

userMarker = L.marker(
  [userLat,userLng],
  {icon:userIcon}
).addTo(map);


// JOYLASHUVNI OLISH
if(navigator.geolocation){

  navigator.geolocation.getCurrentPosition(

    function(position){

      userLat = position.coords.latitude;
      userLng = position.coords.longitude;

      userMarker.setLatLng([
        userLat,
        userLng
      ]);

      map.setView(
        [userLat,userLng],
        15
      );

      document.getElementById("fromText").innerText =
        "Sizning joylashuvingiz";

      createDrivers();

    },

    function(){

      createDrivers();

    },

    {
      enableHighAccuracy:true,
      timeout:10000
    }

  );

}else{

  createDrivers();

}


// HAYDOVCHI ICON
function driverIcon(){

  return L.divIcon({

    className:"",

    html:
      '<div class="driver-marker">🚕</div>',

    iconSize:[38,38],

    iconAnchor:[19,19]

  });

}


// HAYDOVCHILARNI YARATISH
function createDrivers(){

  drivers.forEach(
    d => map.removeLayer(d.marker)
  );

  drivers=[];

  for(let i=0;i<7;i++){

    let angle =
      Math.random() *
      Math.PI *
      2;

    let distance =
      0.002 +
      Math.random()*0.008;

    let lat =
      userLat +
      Math.cos(angle)*distance;

    let lng =
      userLng +
      Math.sin(angle)*distance;

    let marker =
      L.marker(
        [lat,lng],
        {
          icon:driverIcon()
        }
      ).addTo(map);

    let driver = {

      marker:marker,

      name:
        driverNames[
          i % driverNames.length
        ],

      car:
        cars[
          i % cars.length
        ],

      lat:lat,

      lng:lng

    };

    marker.bindPopup(

      "<b>🚕 " +
      driver.name +
      "</b><br>" +

      driver.car +
      "<br>⭐ 4.9"

    );

    drivers.push(driver);

  }

  updateDriverCount();

}


// HAYDOVCHILAR SONI
function updateDriverCount(){

  document.getElementById(
    "driverCount"
  ).innerText =
    drivers.length +
    " ta mashina yaqin";

}


// HAYDOVCHILARNI HARAKATLANTIRISH
setInterval(function(){

  drivers.forEach(function(driver){

    let move =
      0.0003;

    let direction =
      Math.random()*Math.PI*2;

    driver.lat +=
      Math.cos(direction)*move;

    driver.lng +=
      Math.sin(direction)*move;

    driver.marker.setLatLng([
      driver.lat,
      driver.lng
    ]);

  });

},3000);


// TAKSI BUYURTMA
function orderTaxi(){

  if(ordered) return;

  ordered=true;

  document.getElementById(
    "status"
  ).innerText =
    "🚕 Eng yaqin haydovchi qidirilmoqda...";

  document.getElementById(
    "callButton"
  ).innerText =
    "⏳ HAYDOVCHI QIDIRILMOQDA";

  setTimeout(function(){

    if(drivers.length===0){

      document.getElementById(
        "status"
      ).innerText =
        "Hozircha haydovchi topilmadi";

      ordered=false;

      document.getElementById(
        "callButton"
      ).innerText =
        "🚕 TAKSI CHAQIRISH";

      return;

    }

    let nearest =
      findNearestDriver();

    document.getElementById(
      "driverName"
    ).innerText =
      nearest.name;

    document.getElementById(
      "driverCar"
    ).innerText =
      nearest.car +
      " • 4.9 ⭐";

    document.getElementById(
      "driverCard"
    ).style.display =
      "block";

    document.getElementById(
      "status"
    ).innerText =
      "✅ Haydovchi buyurtmangizni qabul qildi";

    document.getElementById(
      "callButton"
    ).style.display =
      "none";

    document.getElementById(
      "cancelButton"
    ).style.display =
      "block";

    nearest.marker.openPopup();

  },1800);

}


// ENG YAQIN HAYDOVCHI
function findNearestDriver(){

  let nearest=null;

  let minDistance=Infinity;

  drivers.forEach(function(driver){

    let distance =
      Math.sqrt(

        Math.pow(
          driver.lat-userLat,
          2
        )

        +

        Math.pow(
          driver.lng-userLng,
          2
        )

      );

    if(distance < minDistance){

      minDistance =
        distance;

      nearest =
        driver;

    }

  });

  return nearest;

}


// HAYDOVCHIGA QO‘NG‘IROQ
function callDriver(){

  alert(
    "Haydovchi bilan bog‘lanish funksiyasi keyingi bosqichda ulanadi."
  );

}


// BUYURTMANI BEKOR QILISH
function cancelOrder(){

  ordered=false;

  document.getElementById(
    "driverCard"
  ).style.display =
    "none";

  document.getElementById(
    "cancelButton"
  ).style.display =
    "none";

  document.getElementById(
    "callButton"
  ).style.display =
    "block";

  document.getElementById(
    "callButton"
  ).innerText =
    "🚕 TAKSI CHAQIRISH";

  document.getElementById(
    "status"
  ).innerText =
    "Buyurtma bekor qilindi";

}


// XARITANI MARKAZGA QAYTARISH
map.on(
  "locationfound",
  function(e){

    userLat =
      e.latlng.lat;

    userLng =
      e.latlng.lng;

  }
);

</script>

</body>
</html>
