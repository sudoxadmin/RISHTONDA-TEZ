<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KINOUZ — Kino olami</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#080808;
  color:white;
  font-family:Arial,Helvetica,sans-serif;
}

button{
  font-family:inherit;
}

.app{
  max-width:1200px;
  margin:auto;
}

/* HEADER */

header{
  height:72px;
  background:#0d0d0d;
  border-bottom:1px solid #252525;
  display:flex;
  align-items:center;
  gap:30px;
  padding:0 25px;
  position:sticky;
  top:0;
  z-index:1000;
}

.logo{
  font-size:28px;
  font-weight:900;
  color:#ffcc00;
  white-space:nowrap;
}

.logo span{
  color:white;
}

nav{
  display:flex;
  gap:22px;
}

nav button{
  background:none;
  border:0;
  color:#aaa;
  font-size:15px;
  cursor:pointer;
}

nav button:hover{
  color:#ffcc00;
}

.search{
  margin-left:auto;
  background:#1a1a1a;
  border:1px solid #292929;
  border-radius:12px;
  padding:11px 15px;
  color:white;
  width:220px;
  outline:none;
}

.search:focus{
  border-color:#ffcc00;
}

/* HERO */

.hero{
  min-height:450px;
  padding:70px 35px;
  display:flex;
  align-items:center;
  background:
    radial-gradient(circle at 70% 40%,#553d00 0,#16120a 30%,#080808 65%);
  position:relative;
  overflow:hidden;
}

.hero:after{
  content:"🎬";
  position:absolute;
  right:7%;
  top:25px;
  font-size:220px;
  opacity:.12;
}

.hero-content{
  max-width:600px;
  position:relative;
  z-index:2;
}

.badge{
  display:inline-block;
  background:#ffcc00;
  color:#000;
  padding:7px 13px;
  border-radius:20px;
  font-size:13px;
  font-weight:bold;
  margin-bottom:18px;
}

.hero h1{
  font-size:55px;
  line-height:1;
  margin-bottom:18px;
}

.hero p{
  color:#bbb;
  font-size:17px;
  line-height:1.6;
  margin-bottom:25px;
}

.watch{
  border:0;
  background:#ffcc00;
  color:#000;
  font-weight:900;
  padding:14px 25px;
  border-radius:10px;
  cursor:pointer;
  font-size:16px;
}

.watch:hover{
  background:#ffe06b;
}

/* CONTENT */

.content{
  padding:30px 25px 60px;
}

.section-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:20px;
}

.section-title h2{
  font-size:25px;
}

.section-title span{
  color:#888;
  font-size:14px;
}

/* CATEGORIES */

.categories{
  display:flex;
  gap:10px;
  overflow-x:auto;
  margin-bottom:30px;
  padding-bottom:5px;
}

.categories::-webkit-scrollbar{
  display:none;
}

.category{
  flex-shrink:0;
  background:#181818;
  color:#ccc;
  border:1px solid #292929;
  padding:10px 17px;
  border-radius:20px;
  cursor:pointer;
}

.category.active,
.category:hover{
  background:#ffcc00;
  color:#000;
  border-color:#ffcc00;
}

/* MOVIES */

.movies{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:18px;
}

.card{
  background:#111;
  border-radius:13px;
  overflow:hidden;
  cursor:pointer;
  transition:.2s;
  border:1px solid #1d1d1d;
}

.card:hover{
  transform:translateY(-5px);
  border-color:#444;
}

.poster{
  height:280px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:70px;
  position:relative;
}

.poster:after{
  content:"▶";
  position:absolute;
  width:45px;
  height:45px;
  border-radius:50%;
  background:#ffcc00;
  color:#000;
  font-size:18px;
  display:flex;
  align-items:center;
  justify-content:center;
  opacity:0;
  transition:.2s;
}

.card:hover .poster:after{
  opacity:1;
}

.p1{
  background:linear-gradient(140deg,#182848,#4b6cb7);
}

.p2{
  background:linear-gradient(140deg,#200122,#6f0000);
}

.p3{
  background:linear-gradient(140deg,#134e5e,#71b280);
}

.p4{
  background:linear-gradient(140deg,#42275a,#734b6d);
}

.p5{
  background:linear-gradient(140deg,#141e30,#243b55);
}

.p6{
  background:linear-gradient(140deg,#3a1c71,#d76d77);
}

.p7{
  background:linear-gradient(140deg,#16222a,#3a6073);
}

.p8{
  background:linear-gradient(140deg,#000428,#004e92);
}

.p9{
  background:linear-gradient(140deg,#4b134f,#c94b4b);
}

.p10{
  background:linear-gradient(140deg,#1f4037,#99f2c8);
}

.card-info{
  padding:12px;
}

.card-info h3{
  font-size:16px;
  margin-bottom:8px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.meta{
  display:flex;
  justify-content:space-between;
  color:#888;
  font-size:12px;
}

.rating{
  color:#ffcc00;
}

/* EMPTY */

.empty{
  display:none;
  text-align:center;
  color:#888;
  padding:60px 10px;
}

/* MODAL */

.modal{
  position:fixed;
  inset:0;
  background:#000d;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:3000;
}

.modal-box{
  width:100%;
  max-width:750px;
  background:#151515;
  border:1px solid #333;
  border-radius:18px;
  overflow:hidden;
  max-height:90vh;
  overflow-y:auto;
}

.modal-top{
  height:300px;
  background:linear-gradient(135deg,#292929,#111);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:100px;
  position:relative;
}

.close{
  position:absolute;
  top:15px;
  right:15px;
  width:40px;
  height:40px;
  border:0;
  border-radius:50%;
  background:#000b;
  color:white;
  font-size:22px;
  cursor:pointer;
}

.modal-content{
  padding:25px;
}

.modal-content h2{
  font-size:30px;
  margin-bottom:12px;
}

.modal-content p{
  color:#aaa;
  line-height:1.6;
  margin:15px 0;
}

.watch-big{
  background:#ffcc00;
  color:#000;
  border:0;
  border-radius:10px;
  padding:14px 22px;
  font-weight:bold;
  cursor:pointer;
}

/* VIDEO */

.player{
  display:none;
  position:fixed;
  inset:0;
  background:#000;
  z-index:5000;
  align-items:center;
  justify-content:center;
}

.player video{
  width:95%;
  max-width:1000px;
  max-height:85vh;
}

.player-close{
  position:absolute;
  top:20px;
  right:25px;
  background:#222;
  color:white;
  border:0;
  border-radius:50%;
  width:45px;
  height:45px;
  font-size:22px;
}

/* FOOTER */

footer{
  border-top:1px solid #222;
  padding:30px 25px;
  color:#777;
  text-align:center;
}

/* MOBILE */

@media(max-width:900px){

  .movies{
    grid-template-columns:repeat(4,1fr);
  }

  .poster{
    height:240px;
  }

}

@media(max-width:650px){

  header{
    padding:0 15px;
    gap:12px;
  }

  .logo{
    font-size:21px;
  }

  nav{
    display:none;
  }

  .search{
    width:140px;
  }

  .hero{
    min-height:380px;
    padding:45px 22px;
  }

  .hero h1{
    font-size:38px;
  }

  .hero p{
    font-size:15px;
  }

  .content{
    padding:25px 15px;
  }

  .movies{
    grid-template-columns:repeat(2,1fr);
    gap:12px;
  }

  .poster{
    height:230px;
    font-size:55px;
  }

  .card-info h3{
    font-size:14px;
  }

}

@media(max-width:380px){

  .search{
    width:115px;
  }

  .poster{
    height:200px;
  }

}
</style>
</head>

<body>

<div class="app">

<header>

  <div class="logo">
    KINO<span>UZ</span>
  </div>

  <nav>
    <button onclick="filterMovies('all')">Bosh sahifa</button>
    <button onclick="filterMovies('Yangi')">Yangi</button>
    <button onclick="filterMovies('Film')">Filmlar</button>
    <button onclick="filterMovies('Serial')">Seriallar</button>
  </nav>

  <input
    class="search"
    id="search"
    type="search"
    placeholder="🔎 Kino qidirish..."
    oninput="searchMovies()"
  >

</header>


<section class="hero">

  <div class="hero-content">

    <div class="badge">
      🔥 BUGUNGI PREMYERA
    </div>

    <h1>
      Kino olamiga<br>
      xush kelibsiz
    </h1>

    <p>
      Sevimli filmlaringizni bir joyda toping.
      Yangi filmlar, seriallar va klassikalarni
      kashf qiling.
    </p>

    <button class="watch" onclick="openMovie(0)">
      ▶ Hozir ko‘rish
    </button>

  </div>

</section>


<main class="content">

  <div class="section-title">
    <h2>Janrlar</h2>
    <span id="movieCount"></span>
  </div>

  <div class="categories">

    <button class="category active"
      onclick="filterMovies('all')">
      Barchasi
    </button>

    <button class="category"
      onclick="filterMovies('Jangari')">
      🔥 Jangari
    </button>

    <button class="category"
      onclick="filterMovies('Komediya')">
      😂 Komediya
    </button>

    <button class="category"
      onclick="filterMovies('Drama')">
      🎭 Drama
    </button>

    <button class="category"
      onclick="filterMovies('Fantastika')">
      🚀 Fantastika
    </button>

    <button class="category"
      onclick="filterMovies('Serial')">
      📺 Serial
    </button>

  </div>


  <div class="section-title">
    <h2>🔥 Mashhur kinolar</h2>
    <span>Ko‘proq</span>
  </div>


  <div class="movies" id="movies"></div>

  <div class="empty" id="empty">
    😕<br><br>
    Bunday kino topilmadi.
  </div>

</main>


<footer>
  <b>KINOUZ</b>
  <br><br>
  Kino olami © 2026
</footer>

</div>


<!-- MODAL -->

<div class="modal" id="modal">

  <div class="modal-box">

    <div class="modal-top" id="modalPoster">

      🎬

      <button
        class="close"
        onclick="closeModal()">
        ×
      </button>

    </div>

    <div class="modal-content">

      <h2 id="modalTitle">
        Kino nomi
      </h2>

      <div id="modalMeta">
        2026 • Film • ⭐ 9.0
      </div>

      <p id="modalDescription">
        Kino haqida ma'lumot.
      </p>

      <button
        class="watch-big"
        onclick="playMovie()">
        ▶ KINONI KO‘RISH
      </button>

    </div>

  </div>

</div>


<!-- PLAYER -->

<div class="player" id="player">

  <button
    class="player-close"
    onclick="closePlayer()">
    ×
  </button>

  <!-- O'ZINGIZGA TEGISHLI VIDEO URL'NI SHU YERGA QO'YISH MUMKIN -->

  <video
    id="video"
    controls
    poster="">
  </video>

</div>


<script>

const movies = [

  {
    title:"So‘nggi jang",
    year:"2026",
    genre:"Jangari",
    type:"Film",
    rating:"9.1",
    icon:"🥷",
    poster:"p1",
    description:
      "Sirli voqealar va katta janglar haqida yangi sarguzasht filmi."
  },

  {
    title:"Kulgi kechasi",
    year:"2026",
    genre:"Komediya",
    type:"Film",
    rating:"8.7",
    icon:"😂",
    poster:"p2",
    description:
      "Do‘stlar hayotidagi kulgili va kutilmagan voqealar."
  },

  {
    title:"So‘nggi umid",
    year:"2025",
    genre:"Drama",
    type:"Film",
    rating:"8.9",
    icon:"🎭",
    poster:"p3",
    description:
      "Inson hayoti, tanlov va umid haqida ta'sirli hikoya."
  },

  {
    title:"Kelajak shahri",
    year:"2026",
    genre:"Fantastika",
    type:"Film",
    rating:"9.3",
    icon:"🚀",
    poster:"p4",
    description:
      "Kelajakdagi ulkan shahar va uning sirli texnologiyalari."
  },

  {
    title:"Qora tun",
    year:"2025",
    genre:"Jangari",
    type:"Film",
    rating:"8.8",
    icon:"🌑",
    poster:"p5",
    description:
      "Bir tun ichida sodir bo‘ladigan xavfli sarguzasht."
  },

  {
    title:"Do‘stlar",
    year:"2026",
    genre:"Komediya",
    type:"Serial",
    rating:"8.5",
    icon:"👨‍👩‍👧",
    poster:"p6",
    description:
      "Do‘stlarning kundalik hayotidagi qiziqarli voqealar."
  },

  {
    title:"Cheksiz yo‘l",
    year:"2025",
    genre:"Drama",
    type:"Film",
    rating:"8.6",
    icon:"🛣️",
    poster:"p7",
    description:
      "Uzoq safar va hayotdagi yangi boshlanishlar haqida."
  },

  {
    title:"Mars",
    year:"2026",
    genre:"Fantastika",
    type:"Film",
    rating:"9.0",
    icon:"🔴",
    poster:"p8",
    description:
      "Insoniyatning Marsdagi birinchi katta sarguzashti."
  },

  {
    title:"Sirli mehmon",
    year:"2025",
    genre:"Drama",
    type:"Serial",
    rating:"8.4",
    icon:"🕵️",
    poster:"p9",
    description:
      "Sirli mehmon kelganidan keyin hamma narsa o‘zgaradi."
  },

  {
    title:"Yashil sayyora",
    year:"2026",
    genre:"Fantastika",
    type:"Film",
    rating:"8.9",
    icon:"🌍",
    poster:"p10",
    description:
      "Kelajakdagi yashil sayyora va yangi hayot haqida."
  }

];


let currentMovie = null;


/* KINOLARNI CHIQARISH */

function renderMovies(list){

  const container =
    document.getElementById("movies");

  const empty =
    document.getElementById("empty");

  container.innerHTML="";

  document.getElementById(
    "movieCount"
  ).innerText =
    list.length + " ta kino";


  if(list.length===0){

    empty.style.display="block";

    return;

  }

  empty.style.display="none";


  list.forEach((movie,index)=>{

    const card =
      document.createElement("div");

    card.className="card";

    card.onclick=function(){

      openMovie(
        movies.indexOf(movie)
      );

    };


    card.innerHTML=`

      <div class="poster ${movie.poster}">
        ${movie.icon}
      </div>

      <div class="card-info">

        <h3>
          ${movie.title}
        </h3>

        <div class="meta">

          <span>
            ${movie.year} • ${movie.type}
          </span>

          <span class="rating">
            ⭐ ${movie.rating}
          </span>

        </div>

      </div>

    `;

    container.appendChild(card);

  });

}


/* FILTRLASH */

function filterMovies(category){

  document
    .querySelectorAll(".category")
    .forEach(btn=>{
      btn.classList.remove("active");
    });


  if(category==="all"){

    renderMovies(movies);

    return;

  }


  const result =
    movies.filter(movie =>

      movie.genre===category ||
      movie.type===category

    );


  renderMovies(result);

}


/* QIDIRUV */

function searchMovies(){

  const text =
    document
      .getElementById("search")
      .value
      .toLowerCase()
      .trim();


  if(!text){

    renderMovies(movies);

    return;

  }


  const result =
    movies.filter(movie=>

      movie.title
        .toLowerCase()
        .includes(text)

      ||

      movie.genre
        .toLowerCase()
        .includes(text)

    );


  renderMovies(result);

}


/* KINO OCHISH */

function openMovie(index){

  currentMovie =
    movies[index];


  document.getElementById(
    "modalTitle"
  ).innerText =
    currentMovie.title;


  document.getElementById(
    "modalMeta"
  ).innerText =

    currentMovie.year
    +" • "
    +currentMovie.type
    +" • ⭐ "
    +currentMovie.rating;


  document.getElementById(
    "modalDescription"
  ).innerText =
    currentMovie.description;


  document.getElementById(
    "modalPoster"
  ).className =
    "modal-top "
    +currentMovie.poster;


  document.getElementById(
    "modalPoster"
  ).innerHTML =

    currentMovie.icon +

    `<button
      class="close"
      onclick="closeModal()">
      ×
    </button>`;


  document.getElementById(
    "modal"
  ).style.display =
    "flex";

}


/* MODALNI YOPISH */

function closeModal(){

  document.getElementById(
    "modal"
  ).style.display =
    "none";

}


/* VIDEO */

function playMovie(){

  /*
   Bu yerga faqat o'zingizga tegishli
   yoki qonuniy foydalanish huquqiga ega
   video manzilini qo'yishingiz mumkin.
  */

  alert(
    "Video player tayyor. Endi qonuniy video fayl yoki video manzilini ulash mumkin."
  );

}


/* PLAYER */

function closePlayer(){

  const player =
    document.getElementById("player");

  const video =
    document.getElementById("video");

  video.pause();

  player.style.display="none";

}


/* MODAL TASHQARISINI BOSISH */

document
  .getElementById("modal")
  .addEventListener(
    "click",
    function(e){

      if(e.target===this){

        closeModal();

      }

    }
  );


/* BOSHLANG'ICH */

renderMovies(movies);

</script>

</body>
</html>
